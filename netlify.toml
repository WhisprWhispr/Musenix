[build]
  publish = "public"
  command = ""

[build.environment]
  GIT_LFS_ENABLED = "true"

[[redirects]]
  from = "/download/android"
  to = "/downloads/MusenixMusical-1.0.0.apk"
  status = 200
  force = true

[[redirects]]
  from = "/download/apk"
  to = "/downloads/MusenixMusical-1.0.0.apk"
  status = 200
  force = true

[[redirects]]
  from = "/download/ios"
  to = "/downloads/MusenixMusical-1.0.0.ipa"
  status = 200
  force = true

[[redirects]]
  from = "/download/ipa"
  to = "/downloads/MusenixMusical-1.0.0.ipa"
  status = 200
  force = true

[[redirects]]
  from = "/download/ios-profile"
  to = "/downloads/musenix-musical.mobileconfig"
  status = 200
  force = true

[[redirects]]
  from = "/api/info"
  to = "/api/info.json"
  status = 200
  force = true

[[headers]]
  for = "/downloads/MusenixMusical-1.0.0.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"MusenixMusical-1.0.0.apk\""
    Cache-Control = "no-cache"

[[headers]]
  for = "/downloads/MusenixMusical-1.0.0.ipa"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Disposition = "attachment; filename=\"MusenixMusical-1.0.0.ipa\""
    Cache-Control = "no-cache"

[[headers]]
  for = "/downloads/musenix-musical.mobileconfig"
  [headers.values]
    Content-Type = "application/x-apple-aspen-config"
    Content-Disposition = "attachment; filename=\"musenix-musical.mobileconfig\""

